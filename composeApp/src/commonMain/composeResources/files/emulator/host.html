<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>DRAUGR host</title>
  <style>
    /* Viewport units, not percentages: inside the platform web views a percentage height on
       body resolved to zero, which left the guest screen unmeasurable. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #screen_container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      background: #000;
    }

    /* v86 writes text output into a div and graphics into the canvas. Only one is ever
       visible, decided by the guest's video mode. The div is scaled by bridge.js to fit,
       because an 80x25 text screen has no pixel size of its own. */
    #screen_container > div {
      color: #22de80;
      font-family: monospace;
      font-size: 16px;
      line-height: 1.05;
      white-space: pre;
      transform-origin: top left;
      overflow: hidden;
    }

    #screen_container {
      align-items: flex-start;
      justify-content: flex-start;
      overflow: hidden;
    }

    #screen_container > canvas {
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="screen_container">
    <div></div>
    <canvas></canvas>
  </div>
  <script src="v86/libv86.js"></script>
  <script src="bridge.js"></script>
</body>
</html>
