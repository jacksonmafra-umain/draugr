<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>DRAUGR host</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #screen_container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* v86 writes text output into a div and graphics into the canvas. Only one is ever
       visible, decided by the guest's video mode. */
    #screen_container > div {
      color: #22de80;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.05;
      white-space: pre;
    }

    #screen_container > canvas {
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div id="screen_container">
    <div></div>
    <canvas></canvas>
  </div>
  <script src="v86/libv86.js"></script>
  <script src="bridge.js"></script>
</body>
</html>
